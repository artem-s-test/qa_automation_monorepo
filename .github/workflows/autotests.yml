name: Autotests
on:
  pull_request:
    branches: [main]
  push: 
    branches: [main]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Start application
        run: docker compose up -d --build
      - name: Wait for application to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4040/api-docs > /dev/null && curl -sf http://localhost:5173 > /dev/null; then
              echo "Application is up"
              exit 0
            fi
            echo "Waiting for application..."
            sleep 2
          done
          echo "Application did not become ready in time"
          docker compose logs
          exit 1

      - name: Build tests image
        run: docker build -t qa-automation-tests ./qa-automation
      - name: Run autotests
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CI: 'true'
          BASE_URL: http://localhost:5173
          DB_USER: headliner
          DB_PASSWORD: headliner_pass
          DB_NAME: headliner_db
        run: |
          mkdir -p qa-automation/playwright-report qa-automation/test-results

          docker run --rm --init --ipc=host --network host \
            -e CI \
            -e BASE_URL \
            -e DB_USER \
            -e DB_PASSWORD \
            -e DB_NAME \
            -v "${GITHUB_WORKSPACE}/qa-automation/playwright-report:/app/playwright-report" \
            -v "${GITHUB_WORKSPACE}/qa-automation/test-results:/app/test-results" \
            qa-automation-tests
      
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: qa-automation/playwright-report
          retention-days: 14
      - name: Stop application
        if: always()
        run: docker compose down -v