name: Playwright tests
on: 
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test 