services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DB:-headliner_db}
      MYSQL_USER: ${MYSQL_USER:-headliner}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-headliner_pass}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./apps/backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./apps/backend/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-4040}:${PORT:-4040}"
    environment:
      PORT: ${PORT:-4040}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-headliner}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-headliner_pass}
      MYSQL_DB: ${MYSQL_DB:-headliner_db}
      APP_DOMAIN: ${APP_DOMAIN:-http://localhost:4040}
    volumes:
      - uploads:/app/public
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4040}
    depends_on:
      - backend

  # Автотести (Playwright). Не запускається разом зі звичайним `docker compose up`
  # завдяки `profiles: [tests]` — щоб не заважати локальній розробці. Запускається
  # явно: `docker compose run --rm tests` (див. .github/workflows/autotests.yml).
  tests:
    build:
      context: ./qa-automation
      dockerfile: Dockerfile
    profiles: ["tests"]
    environment:
      CI: "true"
      # Тести звертаються до фронтенду за іменем сервісу в спільній Docker-мережі
      # compose, а не через localhost — контейнери в одній мережі бачать одне одного
      # за назвою сервісу.
      BASE_URL: http://frontend:5173
    volumes:
      - ./qa-automation/playwright-report:/app/playwright-report
      - ./qa-automation/test-results:/app/test-results
    depends_on:
      - frontend

volumes:
  mysql_data:
  uploads:
